<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14213D"><title>Cuentas</title>
<style>
:root{--ink:#14213D;--bg:#F4F6F8;--mut:#6B7280;--line:#E3E7EC;--in:#1D4ED8;--out:#C2410C;--sv:#0B7A5E}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 96px}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:20px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}.mut{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.in{color:var(--in)}.out{color:var(--out)}.sv{color:var(--sv)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ink)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px;justify-content:center}
nav button{flex:1;max-width:130px;border:0;background:none;padding:10px 4px;border-radius:10px;font:inherit;font-weight:600;color:var(--mut)}
nav button.on{background:var(--ink);color:#fff}nav .add{background:var(--sv);color:#fff}
button.p,input,select{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);width:100%;background:#fff;color:var(--ink)}
button.p{background:var(--ink);color:#fff;border:0;font-weight:600}button.l{background:none;border:0;color:var(--mut);font:inherit;padding:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov form{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.mv{padding:10px 0;border-top:1px solid var(--line)}.mv:first-child{border:0}
.err{color:var(--out);font-size:14px;min-height:20px}.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
[data-tip]{position:relative;cursor:help}[data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;margin-top:4px;z-index:5;background:var(--ink);color:#fff;font-size:12px;line-height:1.3;padding:6px 8px;border-radius:6px;width:max-content;max-width:190px;white-space:normal}.grid .card:nth-child(even) [data-tip]::after{left:auto;right:0}.seg button{padding:10px 2px;font-size:14px}nav button{font-size:14px;padding:10px 2px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body><main id="app"></main><div id="nav"></div>
<script>
const p2=x=>String(x).padStart(2,'0'),ds=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,D=s=>new Date(s+'T12:00:00');
const today=()=>ds(new Date()),addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ds(d)},wk=s=>addD(s,-((D(s).getDay()+2)%7)); // semanas desde el viernes
const $=s=>document.querySelector(s),money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Error'),{st:r.status});return j};
let S={f:{types:[],min:'',max:'',wallet:'',q:'',all:false},view:'res',movs:[],goals:[],from:'',to:'',week:wk(today()),goal:null,reg:false};
const sum=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+x.amount,0);
const tip=(l,t)=>`<span class="mut" data-tip="${t}" tabindex="0">${l}</span>`,WN={efectivo:'Efectivo',virtual:'Virtual'};
const bal=(w,upTo)=>S.movs.reduce((s,x)=>{if(x.date>upTo)return s;const a=x.amount;if(x.type=='transferencia')return s+(x.to_wallet==w?a:0)-(x.wallet==w?a:0);
if(x.wallet!=w)return s;return s+(x.type=='ingreso'||x.type=='ajuste'?a:-a)},0);
const grp=(a,k)=>Object.entries(a.reduce((o,x)=>(o[x[k]||'Sin dato']=(o[x[k]||'Sin dato']||0)+x.amount,o),{})).sort((a,b)=>b[1]-a[1]);
const bars=(a,c='var(--ink)')=>{const m=a[0]?a[0][1]:1;return a.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/m*100}%;background:${c}"></i></div>`).join('')||'<p class="mut">Sin datos todavía.</p>'};
async function load(){try{Object.assign(S,await api('data'));if(await genCuotas()>0)Object.assign(S,await api('data'));render()}catch(e){if(e.st==401)loginView();else alert(e.message)}}
function loginView(){$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Cuentas</h1><form class="card" onsubmit="auth(event)"><label>Usuario</label><input name="u" autocomplete="username" required>
<label>Contraseña</label><input name="p" type="password" autocomplete="${S.reg?'new-password':'current-password'}" required><p class="err" id="e"></p>
<button class="p">${S.reg?'Crear cuenta':'Entrar'}</button><button type="button" class="l" onclick="S.reg=!S.reg;loginView()">${S.reg?'Ya tengo cuenta':'Crear una cuenta'}</button></form>`}
async function auth(e){e.preventDefault();const f=e.target;try{await api(S.reg?'register':'login','POST',{username:f.u.value,password:f.p.value});load()}catch(x){$('#e').textContent=x.message}}
function render(keep){const v=S.view;$('#nav').innerHTML=`<nav>${[['res','Resumen'],['sem','Semanas'],['aho','Ahorros'],['cuo','Cuotas']].map(([k,n])=>`<button class="${v==k?'on':''}" onclick="S.view='${k}';S.goal=null;render()">${n}</button>`).join('')}<button class="add" onclick="openForm()">+ Cargar</button></nav>`;
$('#app').innerHTML=v=='res'?resumen():v=='sem'?semana():v=='cuo'?cuotas():S.goal?meta():ahorros();if(!keep)scrollTo(0,0)}
const dd=(a,b)=>Math.round((D(b)-D(a))/864e5)+1,fdd=s=>D(s).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
const perR=k=>{const t=today(),y=+t.slice(0,4),m=+t.slice(5,7);return k=='m'?[t.slice(0,8)+'01',t]:k=='pm'?[ds(new Date(y,m-2,1)),ds(new Date(y,m-1,0))]:k=='y'?[y+'-01-01',t]:['','']};
function per(k){[S.from,S.to]=perR(k);render(1)}
function resumen(){const F=S.from,To=S.to,t=today(),M=S.movs.filter(x=>(!F||x.date>=F)&&(!To||x.date<=To)),ing=sum(M,'ingreso'),egr=sum(M,'egreso'),aho=sum(M,'ahorro');
const ef=bal('efectivo',t),vi=bal('virtual',t),cj=S.goals.reduce((s,g)=>s+gst(g).tot,0),st=F||(S.movs.length?S.movs[S.movs.length-1].date:t),en=To&&To<t?To:t,dias=Math.max(1,dd(st,en));
const pe=F&&To?sum(S.movs.filter(x=>x.date>=addD(F,-dd(F,To))&&x.date<=addD(F,-1)),'egreso'):0,E=M.filter(x=>x.type=='egreso');
const dow=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],byd=grp(E.map(x=>({...x,d:dow[D(x.date).getDay()]})),'d')[0];
const P=[['','Todo'],['m','Este mes'],['pm','Mes pasado'],['y','Este año']],pk=k=>{const[a,b]=perR(k);return a==F&&b==To};
return`<div class="row"><h1>Resumen</h1><button class="l" style="color:var(--ink);font-weight:600" onclick="openExport()">⬇ Exportar Excel</button></div>
<div class="card"><div>${tip('Disponible','Lo que tenés hoy en tus billeteras (efectivo + virtual), contando todo desde que empezaste. No incluye lo guardado en cajas de ahorro.')}</div><div class="big">${money(ef+vi)}</div></div>
<div class="grid">${['efectivo','virtual'].map(w=>`<div class="card">${tip(WN[w],'Saldo actual de esta billetera. Si no coincide con lo que tenés de verdad, corregilo.')}<br><b>${money(w=='efectivo'?ef:vi)}</b><br><button class="l" style="padding:4px 0" onclick="corr('${w}')">Corregir saldo</button></div>`).join('')}
<div class="card">${tip('En ahorros','Lo que hay hoy en todas tus cajas de ahorro.')}<br><b class="sv">${money(cj)}</b></div><div class="card">${tip('Total','Disponible + ahorros.')}<br><b>${money(ef+vi+cj)}</b></div></div>
<h2>Análisis</h2><div class="seg">${P.map(([k,n])=>`<button type="button" class="${pk(k)?'on':''}" onclick="per('${k}')">${n}</button>`).join('')}</div>
<div class="grid"><div><label>Desde</label><input type="date" value="${F}" onchange="S.from=this.value;render(1)"></div><div><label>Hasta</label><input type="date" value="${To}" onchange="S.to=this.value;render(1)"></div></div>
<p class="mut">${F||To?`Del ${F?fdd(F):'inicio'} al ${To?fdd(To):'hoy'}`:'Todo el historial'}</p>
<div class="grid"><div class="card"><div>${tip('Ingresos','Plata que entró en el período.')}</div><b class="in">${money(ing)}</b></div><div class="card"><div>${tip('Gastos','Lo que gastaste en el período, sin contar los ahorros.')}</div><b class="out">${money(egr)}</b></div>
<div class="card"><div>${tip('Ahorrado','Lo que aportaste a tus cajas en el período, menos lo que retiraste.')}</div><b class="sv">${money(aho)}</b></div><div class="card"><div>${tip('Tasa de ahorro','Porcentaje de tus ingresos que fue a ahorro.')}</div><b>${ing?Math.round(aho/ing*100):0}%</b></div>
<div class="card"><div>${tip('Gasto diario prom.','Gastos del período divididos por los días transcurridos.')}</div><b>${money(egr/dias)}</b></div><div class="card"><div>${tip('vs. período anterior','Cuánto más o menos gastaste que en el período de igual duración inmediatamente anterior. Elegí desde y hasta para verlo.')}</div><b>${pe?(egr>pe?'+':'')+Math.round((egr-pe)/pe*100)+'%':'—'}</b></div></div>
${byd?`<p class="mut">Día en que más gastás: <b>${byd[0]}</b></p>`:''}<h2>Gastos por importancia</h2><div class="card">${bars(grp(E,'importance'),'var(--out)')}</div>
<h2>Gastos por billetera</h2><div class="card">${bars(grp(E.map(x=>({...x,w:WN[x.wallet]||'Caja de ahorro'})),'w'))}</div><h2>Gastos por categoría</h2><div class="card">${bars(grp(E,'category'))}</div>`}
async function corr(w){const cur=bal(w,today()),r=prompt(`¿Cuánto tenés realmente en ${WN[w]}?\nHoy la app dice ${money(cur)}.`,Math.round(cur));if(r==null||r.trim()=='')return;
const v=+r.replace(/\$|\s/g,'').replace(/\./g,'').replace(',','.');if(!isFinite(v))return alert('Monto inválido');const d=Math.round((v-cur)*100)/100;if(!d)return alert('El saldo ya coincide.');
try{await api('movements','POST',{type:'ajuste',amount:d,date:today(),wallet:w,detail:'Corrección de saldo'});load()}catch(e){alert(e.message)}}
function semana(){const a=S.week,b=addD(a,6),W=S.movs.filter(x=>x.date>=a&&x.date<=b),ing=sum(W,'ingreso'),egr=sum(W,'egreso'),aho=sum(W,'ahorro'),aj=sum(W,'ajuste'),egW=sum(W.filter(x=>!x.goal_id),'egreso'),f=s=>D(s).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
return`<h1>Semana</h1><div class="row"><button class="l" onclick="S.week=addD(S.week,-7);render()">‹ Anterior</button><b>${f(a)} – ${f(b)}</b><button class="l" onclick="S.week=addD(S.week,7);render()">Siguiente ›</button></div>
<div class="card" style="margin-top:10px"><div>${tip('Resultado de la semana','Cuánto cambió tu disponible: ingresos y correcciones menos gastos y ahorro de esta semana. No cuenta lo pagado con cajas de ahorro.')}</div><div class="big">${money(ing+aj-egW-aho)}</div><div class="mut"><span class="in">Ingresos ${money(ing)}</span> · <span class="out">Gastos ${money(egr)}</span> · <span class="sv">Ahorro ${money(aho)}</span>${aj?` · <span>Correcciones ${money(aj)}</span>`:''}</div></div>
<div class="grid">${['efectivo','virtual'].map(w=>{const e=bal(w,b),d=e-bal(w,addD(a,-1));return`<div class="card">${tip(WN[w],'Saldo al cierre de la semana. Arrastra lo de semanas anteriores.')}<br><b>${money(e)}</b><div class="mut">${d>=0?'+':'−'}${money(Math.abs(d))} esta semana</div></div>`}).join('')}</div>
${filtros()}<div id="lst">${lista()}</div>`}
function mvRow(x){const g=S.goals.find(g=>g.id==x.goal_id),ret=x.type=='ahorro'&&x.amount<0,c=({ingreso:'in',ahorro:'sv',ajuste:'in',transferencia:''})[x.type]??'out',
sg=x.type=='transferencia'?'':S.view=='aho'&&S.goal?(x.type=='ahorro'&&x.amount>0?'+':'−'):(x.type=='ingreso'||(x.type=='ajuste'&&x.amount>0)||ret)?'+':'−';
return`<div class="mv row"><div><div class="${c||'mut'}" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">${ret?'Retiro':TL[x.type]}</div><div>${esc(x.detail||(x.type=='transferencia'?'Pase de billetera':x.category)||(g?(ret?'Retiro de ahorro':'Ahorro'):TL[x.type]))}</div><div class="mut">${D(x.date).toLocaleDateString('es-AR',S.f.all&&S.view=='sem'?{weekday:'short',day:'numeric',month:'short',year:'2-digit'}:{weekday:'short',day:'numeric'})} ${g?(x.type=='egreso'?`<span class="tag">desde ${esc(cn(g))}</span>`:ret?`<span class="tag">${esc(cn(g))}</span> <span class="tag">→ ${WN[x.wallet]}</span>`:`<span class="tag">${WN[x.wallet]}</span> <span class="tag">→ ${esc(cn(g))}</span>`):[x.type=='transferencia'?WN[x.wallet]+' → '+WN[x.to_wallet]:WN[x.wallet],x.category,x.importance].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div></div>
<div style="text-align:right"><b class="${c}">${sg}${money(Math.abs(x.amount))}</b><br><button class="l" onclick="edit(${x.id})">editar</button><button class="l" onclick="del(${x.id})">borrar</button></div></div>`}
async function del(id){if(confirm('¿Borrar este movimiento?')){await api('movements/'+id,'DELETE');load()}}
function edit(id){const x=S.movs.find(x=>x.id==id);if(x)openForm(null,null,x)}
function gst(g){const A=S.movs.filter(x=>x.goal_id==g.id),tot=A.reduce((s,x)=>s+(x.type=='egreso'?-x.amount:x.amount),0),dec=A.filter(x=>x.type=='egreso'&&x.dec_target).reduce((s,x)=>s+x.amount,0),tgt=Math.max(0,g.target-dec),
dep=A.filter(x=>x.type=='ahorro'&&x.amount>0),first=dep.map(x=>x.date).sort()[0],w=first?Math.max(1,Math.round((D(today())-D(first))/6048e5)):1,avg=dep.reduce((s,x)=>s+x.amount,0)/w;
return{A,tot,avg,dep,tgt,dec,pct:g.target?(tgt>0?Math.min(100,Math.max(0,tot)/tgt*100):100):0,eta:tgt&&avg>0&&tot<tgt?Math.ceil((tgt-tot)/avg):null}}
function ahorros(){return`<h1>Ahorros</h1>${S.goals.map(g=>{const s=gst(g);return`<div class="card" onclick="S.goal=${g.id};render()"><div class="row"><b>${esc(cn(g))}</b><b class="sv">${money(s.tot)}</b></div>${g.target?`<div class="bar"><i style="width:${s.pct}%;background:var(--sv)"></i></div><div class="mut">${Math.round(s.pct)}% de ${money(s.tgt)}${s.dec?' (meta original '+money(g.target)+')':''}</div>`:''}</div>`}).join('')||'<p class="mut">Todavía no tenés cajas de ahorro.</p>'}
<button class="p" onclick="newGoal()">Nueva caja de ahorro</button>`}
async function newGoal(){const name=prompt('Nombre de la caja (ej: Auto → Caja de Ahorro Auto)');if(!name)return;const t=prompt('Meta: monto objetivo de la caja (opcional)')||0;
try{await api('goals','POST',{name,target:+String(t).replace(/\./g,'').replace(',','.')||0});load()}catch(e){alert(e.message)}}
function meta(){const g=S.goals.find(g=>g.id==S.goal),s=gst(g),last=s.dep[0];
return`<button class="l" onclick="S.goal=null;render()">‹ Ahorros</button><h1>${esc(cn(g))}</h1><div class="card"><div>${tip('Total ahorrado','Plata que hay hoy en esta caja.')}</div><div class="big sv">${money(s.tot)}</div>
${g.target?`<div class="bar"><i style="width:${s.pct}%;background:var(--sv)"></i></div><div class="mut">${Math.round(s.pct)}% de ${money(s.tgt)}${s.dec?' (original '+money(g.target)+', ya pagaste '+money(s.dec)+' en cuotas)':''} · faltan ${money(Math.max(0,s.tgt-s.tot))}</div>`:''}</div>
<div class="grid"><div class="card"><div>${tip('Promedio semanal','Aportes divididos por las semanas desde el primero.')}</div><b>${money(s.avg)}</b></div><div class="card"><div>${tip('Aportes','Cantidad de veces que aportaste.')}</div><b>${s.dep.length}</b></div>
<div class="card"><div>${tip('Último aporte','Monto de tu aporte más reciente.')}</div><b>${last?money(last.amount):'—'}</b></div><div class="card"><div>${tip('Meta en','Semanas estimadas para llegar al objetivo al ritmo actual.')}</div><b>${s.eta?s.eta+' semanas':'—'}</b></div></div>
<h2>Movimientos de la caja</h2><div class="card">${s.A.map(mvRow).join('')||'<p class="mut">Sin aportes todavía.</p>'}</div>
<div class="grid"><button class="p" onclick="openForm('ahorro',${g.id})">Aportar</button><button class="p" style="background:#fff;color:var(--ink);border:1px solid var(--ink)" onclick="openForm('retiro',${g.id})">Retirar</button></div>
<div class="row"><button class="l" onclick="editGoal(${g.id})">Editar caja</button><button class="l" onclick="delGoal(${g.id})">Eliminar caja</button></div>`}
async function editGoal(id){const g=S.goals.find(g=>g.id==id),name=prompt('Nombre de la caja',g.name);if(name==null||!name.trim())return;const t=prompt('Meta: monto objetivo (0 = sin meta)',g.target||0);if(t==null)return;
try{await api('goals/'+id,'PUT',{name,target:+String(t).replace(/\./g,'').replace(',','.')||0});load()}catch(e){alert(e.message)}}
async function delGoal(id){if(confirm('¿Eliminar esta meta?'))try{await api('goals/'+id,'DELETE');S.goal=null;load()}catch(e){alert(e.message)}}
const CAT=['Comida','Transporte','Vivienda','Servicios','Salud','Ocio','Compras','Otros'];let T='egreso',LWV='virtual';
// mv: movimiento a editar. 'retiro' = ahorro con monto negativo (de la caja a una billetera); 'ajuste' = corrección de saldo
function openForm(type,gid,mv){const ret=mv&&mv.type=='ahorro'&&mv.amount<0;T=mv?(ret?'retiro':mv.type):type||'egreso';gid=mv?mv.goal_id:gid;
const WS=(n,l,v)=>`<label>${l}</label><select name="${n}"><option value="virtual" ${v=='virtual'?'selected':''}>Virtual</option><option value="efectivo" ${v=='efectivo'?'selected':''}>Efectivo</option></select>`;
const CJ=(l,o)=>`<label>${l}</label><select name="goal_id" required>${S.goals.map(g=>`<option value="${g.id}" ${g.id==gid?'selected':''}>${esc(cn(g))}${o?' ('+money(gst(g).tot)+')':''}</option>`).join('')||'<option value="">Creá una caja primero</option>'}</select>`;
const w=mv?mv.date:S.view=='sem'&&!(today()>=S.week&&today()<=addD(S.week,6))?S.week:today(),tabs=[['ingreso','Ingreso'],['egreso','Gasto'],['ahorro','Ahorro'],['retiro','Retiro'],['transferencia','Pase']].concat(T=='ajuste'?[['ajuste','Corrección']]:[]);
const o=document.createElement('div');o.className='ov';o.innerHTML=`<form id="f">${mv?'<h2 style="margin-top:0">Editar movimiento</h2>':''}<div class="seg">${tabs.map(([k,n])=>`<button type="button" data-t="${k}">${n}</button>`).join('')}</div>
<label>Monto</label><input name="amount" type="number" step="any" inputmode="decimal" required value="${mv?(ret?-mv.amount:mv.amount):''}"><label>Fecha</label><input name="date" type="date" value="${w}" required>
<label>Detalle</label><input name="detail" maxlength="120" value="${esc(mv?mv.detail:'')}"><div id="x"></div><p class="err" id="e"></p><button class="p">Guardar</button><button type="button" class="l" style="width:100%">Cancelar</button></form>`;
document.body.appendChild(o);const f=o.querySelector('form'),x=o.querySelector('#x'),wv=mv?mv.wallet||LWV:LWV;
const set=()=>{f.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==T));
x.innerHTML=T=='transferencia'?WS('wallet','Desde',wv)+WS('to_wallet','Hacia',mv&&mv.to_wallet||(wv=='virtual'?'efectivo':'virtual'))
:T=='ahorro'?WS('wallet','Desde la billetera',wv)+CJ('Hacia la caja de ahorro')
:T=='retiro'?CJ('Desde la caja de ahorro',1)+WS('wallet','Hacia la billetera',wv)
:T=='egreso'?`<label>Se paga con</label><select name="src"><option value="virtual" ${wv=='virtual'?'selected':''}>Virtual</option><option value="efectivo" ${wv=='efectivo'&&!(mv&&mv.goal_id)?'selected':''}>Efectivo</option>${S.goals.map(g=>`<option value="g${g.id}" ${mv&&mv.goal_id==g.id?'selected':''}>${esc(cn(g))}</option>`).join('')}</select>
<label>Categoría</label><input name="category" list="cats" value="${esc(mv?mv.category:'')}"><datalist id="cats">${CAT.map(c=>`<option>${c}`).join('')}</datalist><label>Importancia</label><select name="importance">${['Esencial','Necesario','Prescindible'].map(i=>`<option ${mv&&mv.importance==i?'selected':''}>${i}`).join('')}</select>`
:T=='ajuste'?WS('wallet','Billetera',wv)+'<p class="mut">Corrección de saldo: suma (o resta, con monto negativo) a la billetera sin contar como ingreso ni gasto.</p>'
:WS('wallet','Billetera',wv)+`<label>Categoría</label><input name="category" placeholder="Sueldo, extra…" value="${esc(mv?mv.category:'')}">`};set();
f.onclick=e=>{if(e.target.dataset.t){T=e.target.dataset.t;set()}else if(e.target.classList.contains('l'))o.remove()};
f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));b.type=T;b.amount=+b.amount;
if(T=='retiro'){b.type='ahorro';b.amount=-Math.abs(b.amount)}
if(T=='egreso'){const s=b.src;delete b.src;if(s[0]=='g'){b.goal_id=+s.slice(1);b.wallet='';b.dec_target=mv&&mv.goal_id==b.goal_id?mv.dec_target:0}else{b.wallet=s;b.goal_id=null}}
LWV=b.wallet||LWV;try{await api(mv?'movements/'+mv.id:'movements',mv?'PUT':'POST',b);o.remove();load()}catch(x){f.querySelector('#e').textContent=x.message}}}

const TL={ingreso:'Ingreso',egreso:'Gasto',ahorro:'Ahorro',transferencia:'Pase',ajuste:'Corrección'};
const flt=f=>S.movs.filter(x=>(!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to)&&(!f.type||x.type==f.type)&&(!f.wallet||x.wallet==f.wallet||x.to_wallet==f.wallet)&&(!f.importance||x.importance==f.importance)&&(!f.category||x.category==f.category)&&(!f.goal||x.goal_id==f.goal));
async function saveFile(name,buf){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
function openExport(){const cats=[...new Set(S.movs.map(x=>x.category).filter(Boolean))].sort(),
sel=(n,l,o)=>`<label>${l}</label><select name="${n}"><option value="">Todos</option>${o.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select>`,
o=document.createElement('div');o.className='ov';
o.innerHTML=`<form><h2 style="margin-top:0">Exportar a Excel</h2><div class="grid"><div><label>Desde</label><input type="date" name="from" value="${S.from}"></div><div><label>Hasta</label><input type="date" name="to" value="${S.to}"></div></div>
${sel('type','Tipo',Object.entries(TL))}${sel('wallet','Billetera',Object.entries(WN))}${sel('importance','Importancia',['Esencial','Necesario','Prescindible'].map(x=>[x,x]))}
${sel('category','Categoría',cats.map(x=>[x,x]))}${sel('goal','Caja de ahorro',S.goals.map(g=>[g.id,cn(g)]))}
<p class="mut" id="cnt"></p><button class="p">Descargar Excel</button><button type="button" class="l" style="width:100%">Cancelar</button></form>`;
document.body.appendChild(o);const f=o.querySelector('form'),fd=()=>Object.fromEntries(new FormData(f)),upd=()=>{o.querySelector('#cnt').textContent=flt(fd()).length+' movimientos coinciden con los filtros'};upd();
f.oninput=upd;f.onclick=e=>{if(e.target.classList.contains('l'))o.remove()};
f.onsubmit=async e=>{e.preventDefault();const r=flt(fd());if(!r.length)return alert('No hay movimientos con esos filtros');o.remove();await doExport(r,fd())}}
async function doExport(rows,f){if(!window.XLSX)return alert('No se pudo cargar el generador de Excel. Revisá tu conexión.');
const sg=x=>x.type=='transferencia'?0:(x.type=='ingreso'||x.type=='ajuste')?x.amount:-x.amount,gn=id=>{const g=S.goals.find(g=>g.id==id);return g?cn(g):''};
const R=[...rows].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).map(x=>({Fecha:D(x.date),Tipo:TL[x.type],Detalle:x.detail,'Categoría':x.category,Importancia:x.importance,Billetera:WN[x.wallet]||'',Hacia:x.type=='transferencia'?WN[x.to_wallet]:'','Caja de ahorro':gn(x.goal_id),Monto:x.amount,'Monto con signo':sg(x)}));
const mm={};rows.forEach(x=>{const r=mm[x.date.slice(0,7)]??={Mes:x.date.slice(0,7),Ingresos:0,Correcciones:0,Gastos:0,Ahorro:0,'Pagado con cajas':0};
if(x.type=='ingreso')r.Ingresos+=x.amount;else if(x.type=='ajuste')r.Correcciones+=x.amount;else if(x.type=='egreso'){r.Gastos+=x.amount;if(x.goal_id)r['Pagado con cajas']+=x.amount}else if(x.type=='ahorro')r.Ahorro+=x.amount});
const M=Object.values(mm).sort((a,b)=>a.Mes.localeCompare(b.Mes)).map(r=>({...r,Resultado:r.Ingresos+r.Correcciones-(r.Gastos-r['Pagado con cajas'])-r.Ahorro,'Tasa de ahorro (%)':r.Ingresos?Math.round(r.Ahorro/r.Ingresos*1000)/10:0}));
const G=(k,n)=>{const g=grp(rows.filter(x=>x.type=='egreso'),k),t=g.reduce((s,[,v])=>s+v,0);return g.map(([a,v])=>({[n]:a,Total:v,'% del gasto':t?Math.round(v/t*1000)/10:0}))};
const wb=XLSX.utils.book_new(),add=(n,d,w)=>{const ws=XLSX.utils.json_to_sheet(d.length?d:[{Info:'Sin datos'}],{dateNF:'dd/mm/yyyy'});ws['!cols']=w.map(c=>({wch:c}));ws['!autofilter']={ref:ws['!ref']};XLSX.utils.book_append_sheet(wb,ws,n)};
add('Movimientos',R,[12,14,28,16,14,12,12,16,14,16]);add('Resumen mensual',M,[10,14,12,14,14,18,14,18]);add('Gastos por categoría',G('category','Categoría'),[22,14,12]);add('Gastos por importancia',G('importance','Importancia'),[22,14,12]);
await saveFile(`cuentas_${f.from||'inicio'}_${f.to||today()}.xlsx`,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}

const FQ={mensual:'Mensual',semanal:'Semanal',dias:'Cada X días'};
const nth=(p,n)=>{const i=n-1;if(p.freq=='semanal')return addD(p.start,7*i);if(p.freq=='dias')return addD(p.start,p.every*i);
const d=D(p.start),y=d.getFullYear(),m=d.getMonth()+i,dim=new Date(y,m+1,0).getDate();return ds(new Date(y,m,Math.min(d.getDate(),dim)))};
const pst=p=>{const done=p.skip+S.movs.filter(x=>x.plan_id==p.id&&x.type=='egreso').length,rem=Math.max(0,p.total-done);return{done,rem,next:rem?nth(p,done+1):null,end:nth(p,p.total)}};
async function genCuotas(){let n=0;const t=today();for(const p of S.plans||[]){const have=new Set(S.movs.filter(x=>x.plan_id==p.id&&x.type=='egreso').map(x=>x.cuota_n));
for(let i=p.skip+1;i<=p.total;i++){const d=nth(p,i);if(d>t)break;if(have.has(i))continue;
try{await api('movements','POST',{type:'egreso',amount:p.amount,date:d,wallet:p.goal_id?'':p.wallet,goal_id:p.goal_id||null,dec_target:p.dec_target||0,category:'Cuotas',importance:'Necesario',detail:`${p.name} (${i}/${p.total})`,plan_id:p.id,cuota_n:i});
n++}catch(e){}}}return n}
function cuotas(){const t30=addD(today(),30),fd=d=>D(d).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});let deuda=0,prox=0;
const cards=(S.plans||[]).map(p=>{const s=pst(p),g=S.goals.find(g=>g.id==p.goal_id);deuda+=p.amount*s.rem;for(let i=s.done+1;i<=p.total&&nth(p,i)<=t30;i++)prox+=p.amount;
return`<div class="card"><div class="row"><b>${esc(p.name)}</b><b class="out">${money(p.amount)}</b></div><div class="bar"><i style="width:${s.done/p.total*100}%;background:var(--sv)"></i></div>
<div class="mut">Cuota ${Math.min(s.done+1,p.total)} de ${p.total} · ${FQ[p.freq]}${p.freq=='dias'?' ('+p.every+')':''} · pagado ${money(p.amount*s.done)} · falta ${money(p.amount*s.rem)}</div>
<div class="mut">${s.next?'Próxima: '+fd(s.next):'Plan completo'} · termina ${fd(s.end)} · ${g?'se paga con '+esc(cn(g))+(p.dec_target?' (también descuenta de la meta)':''):'se paga con '+WN[p.wallet]}</div><button class="l" onclick="delPlan(${p.id})">Cancelar plan</button></div>`}).join('');
return`<h1>Cuotas</h1><div class="grid"><div class="card">${tip('Próximos 30 días','Total de cuotas que vencen en los próximos 30 días.')}<br><b class="out">${money(prox)}</b></div>
<div class="card">${tip('Deuda restante','Suma de todas las cuotas que todavía faltan pagar.')}<br><b>${money(deuda)}</b></div></div>${cards||'<p class="mut">Todavía no cargaste cuotas.</p>'}<button class="p" onclick="openPlan()">Nuevo plan de cuotas</button>`}
async function delPlan(id){if(confirm('¿Cancelar este plan? Las cuotas ya descontadas se mantienen.')){await api('plans/'+id,'DELETE');load()}}
function openPlan(){const o=document.createElement('div');o.className='ov';
o.innerHTML=`<form><h2 style="margin-top:0">Nuevo plan de cuotas</h2><label>Nombre</label><input name="name" required maxlength="60" placeholder="Ej: Celular">
<div class="grid"><div><label>Monto por cuota</label><input name="amount" type="number" step="any" min="0" required></div><div><label>Cantidad de cuotas</label><input name="total" type="number" min="1" max="600" required></div></div>
<div class="grid"><div><label>Fecha de la 1ª cuota</label><input name="start" type="date" value="${today()}" required></div><div><label>Ya pagadas</label><input name="skip" type="number" min="0" value="0"></div></div>
<label>Frecuencia</label><select name="freq"><option value="mensual">Mensual (mismo día de cada mes)</option><option value="semanal">Semanal</option><option value="dias">Cada X días</option></select>
<div id="ev" hidden><label>Cada cuántos días</label><input name="every" type="number" min="1" value="15"></div>
<div id="wb"><label>Se descuenta de la billetera</label><select name="wallet"><option value="virtual">Virtual</option><option value="efectivo">Efectivo</option></select></div>
<label>Pagar con una caja de ahorro (opcional)</label><select name="goal_id"><option value="">No, pagar con una billetera</option>${S.goals.map(g=>`<option value="${g.id}">${esc(cn(g))}</option>`).join('')}</select><div id="dt" hidden><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="dec_target" style="width:auto"> Descontar también cada cuota de la meta de la caja</label></div>
<p class="err" id="e"></p><button class="p">Crear plan</button><button type="button" class="l" style="width:100%">Cancelar</button></form>`;
document.body.appendChild(o);const f=o.querySelector('form');f.onchange=()=>{const gs=!!f.elements.goal_id.value;o.querySelector('#ev').hidden=f.elements.freq.value!='dias';o.querySelector('#wb').hidden=gs;o.querySelector('#dt').hidden=!gs};f.onclick=e=>{if(e.target.classList.contains('l'))o.remove()};
f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));b.amount=+b.amount;b.total=+b.total;b.skip=+b.skip||0;b.every=+b.every||0;b.goal_id=b.goal_id||null;b.dec_target=b.goal_id&&b.dec_target?1:0;if(b.goal_id)b.wallet='';
try{await api('plans','POST',b);o.remove();load()}catch(x){o.querySelector('#e').textContent=x.message}}}

const fAct=()=>{const f=S.f;return f.all||f.types.length||f.min!==''||f.max!==''||f.wallet||f.q.trim()},upL=()=>{const e=$('#lst');if(e)e.innerHTML=lista()};
const fm=x=>{const f=S.f,q=f.q.trim().toLowerCase(),a=Math.abs(x.amount);return(!f.types.length||f.types.includes(x.type))&&(f.min===''||a>=+f.min)&&(f.max===''||a<=+f.max)&&(!f.wallet||x.wallet==f.wallet||x.to_wallet==f.wallet)&&(!q||[x.detail,x.category,x.importance].join(' ').toLowerCase().includes(q))};
function fT(k){const t=S.f.types;S.f.types=t.includes(k)?t.filter(x=>x!=k):[...t,k];render()}
function lista(){const base=S.f.all?S.movs:S.movs.filter(x=>x.date>=S.week&&x.date<=addD(S.week,6)),r=base.filter(fm);
return`${fAct()?`<p class="mut">Mostrando ${r.length} de ${base.length} movimientos${S.f.all?' (todas las semanas)':''}</p>`:''}<div class="card">${r.map(mvRow).join('')||`<p class="mut">${base.length?'Ningún movimiento coincide con los filtros.':'Sin movimientos. Tocá “+ Cargar” para agregar tu cobro.'}</p>`}</div>`}
function filtros(){const f=S.f;
return`<details ${S.fo||fAct()?'open':''} ontoggle="S.fo=this.open" class="card"><summary><b>Filtros</b>${fAct()?' <span class="tag">activos</span>':''}</summary>
<div class="seg" style="flex-wrap:wrap;margin-top:10px">${Object.entries(TL).map(([k,n])=>`<button type="button" class="${f.types.includes(k)?'on':''}" onclick="fT('${k}')">${n}</button>`).join('')}</div>
<div class="grid"><div><label>Monto mínimo</label><input type="number" inputmode="decimal" value="${esc(f.min)}" oninput="S.f.min=this.value;upL()"></div><div><label>Monto máximo</label><input type="number" inputmode="decimal" value="${esc(f.max)}" oninput="S.f.max=this.value;upL()"></div></div>
<label>Billetera</label><select onchange="S.f.wallet=this.value;upL()"><option value="">Todas</option>${Object.entries(WN).map(([k,n])=>`<option value="${k}" ${f.wallet==k?'selected':''}>${n}</option>`).join('')}</select>
<label>Buscar en detalle o categoría</label><input value="${esc(f.q)}" oninput="S.f.q=this.value;upL()">
<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" ${f.all?'checked':''} onchange="S.f.all=this.checked;upL()"> Buscar en todas las semanas</label>
<button type="button" class="l" onclick="S.f={types:[],min:'',max:'',wallet:'',q:'',all:false};render()">Limpiar filtros</button></details>`}

const cn=g=>'Caja de Ahorro '+g.name;
load();
</script></body></html>
