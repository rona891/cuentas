# Nombre del proyecto y puerto vienen de .env en cada carpeta del VPS
# (prod: /srv/cuentas -> 8090, qa: /srv/cuentas-qa -> 8091).
services:
  cuentas:
    build: .
    restart: unless-stopped
    environment:
      - COOKIE_SECURE=1
      - ALLOW_REGISTER=0
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${PORT_HOST:-8090}:3000"
